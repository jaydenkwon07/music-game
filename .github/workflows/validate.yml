name: validate

# Runs the standalone room-graph solvability validator (spec §7, design doc §7.4).
# Pure Python, no engine — the Godot unit tests stay local per the repo's pattern.
on:
  push:
  pull_request:

jobs:
  validate-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate room graph
        run: python3 scripts/validate_rooms.py
